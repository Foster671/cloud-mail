name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "fetryyu"
database_id = "25265fbb-00e0-4f37-999b-3bb8ecd19af3"

[[kv_namespaces]]
binding = "kv"
id = "3e46db9396bb4ec4846e8e8e030b2e25"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
#ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
#analysis_cache = false
#orm_log = false

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
